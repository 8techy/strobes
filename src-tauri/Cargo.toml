[package]
name = "strobelight"
version = "0.1.0"
description = "BMW exterior light show controller over ENET"
authors = ["Strobelight contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "strobelight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

slt-transport = { path = "crates/slt-transport" }
slt-uds = { path = "crates/slt-uds" }
slt-catalog = { path = "crates/slt-catalog" }
slt-engine = { path = "crates/slt-engine" }
slt-sim = { path = "crates/slt-sim" }

[features]
# Tauri's default feature set is applied by the CLI; this keeps `cargo test` fast.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[workspace]
members = [
    "crates/slt-transport",
    "crates/slt-uds",
    "crates/slt-catalog",
    "crates/slt-engine",
    "crates/slt-sim",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
    "io-util",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
toml = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
